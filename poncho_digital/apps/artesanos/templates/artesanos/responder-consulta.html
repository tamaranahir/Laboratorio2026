{% extends 'base/base.html' %}

{% block contenido %}
<style>
    body {
        background-color: #f4f6f9;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card-evaluar {
        border: none;
        border-radius: 1rem;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        overflow: hidden;
    }
    .header-evaluar {
        background-color: #294268;
        color: #ffffff;
        padding: 1.5rem;
        text-align: center;
    }
    .titulo-evaluar {
        color: #ebdcb9;
        font-weight: 700;
        margin-bottom: 0.25rem;
    }
</style>

<div class="container py-3">
    <div class="card card-evaluar col-md-8 mx-auto mb-5">
        <div class="header-evaluar">
            <h2 class="h4 titulo-evaluar">
                <i class="bi bi-reply-all-fill me-2"></i>Responder Consulta
            </h2>
            <p class="small mb-0 text-white-50">Tu respuesta le llegará únicamente al usuario que realizó la pregunta</p>
        </div>

        <div class="card-body p-4 p-md-5 bg-white">
            <div class="p-3 bg-light rounded-3 mb-4 border">
                <small class="text-muted d-block mb-1">Pregunta enviada por <strong>{{ consulta.usuario.username }}</strong>:</small>
                <p class="mb-0 fw-semibold text-dark">{{ consulta.mensaje }}</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_respuesta" class="form-label fw-bold text-dark">Escribí tu respuesta:</label>
                    {{ form.respuesta }}
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{% url 'artesanos:consultas_recibidas' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn px-4" style="background-color: #294268; color: #ebdcb9; font-weight: 600;">
                        Enviar Respuesta
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
